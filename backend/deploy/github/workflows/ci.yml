# Reference only: GitHub requires this file at .github/workflows/ci.yml to activate it.
name: Marketplace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file backend/deploy/.env.production.example -f backend/deploy/compose.production.yml config --no-env-resolution --quiet
      - run: docker run --rm -e SITE_HOST=example.test -v "$PWD/backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: docker build -t bazaar-api:ci backend
      - run: docker build -t bazaar-web:ci frontend
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bazaar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bazaar
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U bazaar" --health-interval=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://bazaar:ci-only-password@localhost:5432/bazaar
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-thirty-two-characters-long
      BANK_ENCRYPTION_KEY: '1212121212121212121212121212121212121212121212121212121212121212'
      APP_URL: http://localhost:3187
      CORS_ORIGINS: http://localhost:3187
      PORT: '4187'
      API_URL: http://localhost:4187
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4187
      SEED_PASSWORD: BazaarDemo2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run db:generate --prefix backend
      - run: npm run db:migrate --prefix backend
      - run: npm run db:seed --prefix backend
      - run: npm run verify --prefix backend
      - run: npm audit --audit-level=high --prefix backend && npm audit --audit-level=high --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start application and run browser workflows
        run: |
          npm start --prefix backend > /tmp/bazaar-api.log 2>&1 &
          npm start --prefix frontend > /tmp/bazaar-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3187/api/products > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
