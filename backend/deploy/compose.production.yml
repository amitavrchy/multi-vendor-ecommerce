name: bazaar-production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bazaar
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazaar -d bazaar"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10
  api:
    build: {context: .., target: api}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bazaar:${POSTGRES_PASSWORD}@postgres:5432/bazaar
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_URL: https://${SITE_HOST:?Set SITE_HOST}
      CORS_ORIGINS: https://${SITE_HOST}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BANK_ENCRYPTION_KEY: ${BANK_ENCRYPTION_KEY:?Set BANK_ENCRYPTION_KEY}
      PORT: "4187"
      TRUST_PROXY_HOPS: "1"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: ../../frontend
      target: web
      args:
        API_URL: http://api:4187
        NEXT_PUBLIC_SOCKET_URL: https://${SITE_HOST}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
